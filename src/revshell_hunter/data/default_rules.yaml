# revshell-hunter - regras padrão.
# Nomes de processo são comparados em minúsculas.
# Para customizar sem copiar tudo, crie um YAML seu e use `--config`:
#   - chave normal      -> substitui o valor padrão (weights/severity/beacon são mesclados)
#   - extra_<lista>     -> acrescenta itens à lista padrão (ex.: extra_shells)

shells:
  [cmd.exe, powershell.exe, pwsh.exe, bash.exe, wsl.exe, sh, bash, zsh, dash, ash, ksh, fish]

net_tools:
  [nc.exe, ncat.exe, nc, ncat, netcat, socat, plink.exe, chisel, chisel.exe]

lolbins:
  [mshta.exe, rundll32.exe, regsvr32.exe, certutil.exe, bitsadmin.exe, wscript.exe,
   cscript.exe, msbuild.exe, installutil.exe, wmic.exe]

suspicious_parents:
  [winword.exe, excel.exe, powerpnt.exe, outlook.exe, onenote.exe, w3wp.exe, httpd.exe,
   nginx.exe, apache2, php.exe, php-cgi.exe, php-fpm, tomcat9.exe, sqlservr.exe]

common_ports:
  [20, 21, 22, 25, 53, 80, 110, 123, 143, 389, 443, 465, 587, 636, 993, 995, 3389, 5223, 8080, 8443]

suspicious_ports:
  [1234, 1337, 2222, 3333, 4343, 4443, 4444, 4445, 5555, 6666, 6667, 7777, 8888, 9001, 9999,
   12345, 31337, 54321]

suspicious_paths:
  - '\appdata\'
  - '\temp\'
  - '\users\public\'
  - '\programdata\'
  - '\windows\tasks\'
  - '/tmp/'
  - '/dev/shm/'
  - '/var/tmp/'

# Processos conhecidos/legítimos: ficam isentos das regras de porta e de beaconing.
trusted_processes:
  [chrome.exe, msedge.exe, firefox.exe, brave.exe, opera.exe, chrome, firefox, teams.exe,
   ms-teams.exe, slack.exe, zoom.exe, spotify.exe, onedrive.exe, discord.exe, steam.exe,
   steamwebhelper.exe]

# Binários que SEMPRE deveriam estar em diretórios do sistema (anti-masquerading, Windows).
windows_system_binaries:
  [cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe,
   regsvr32.exe, certutil.exe, bitsadmin.exe]

trusted_system_dirs:
  - '\windows\system32\'
  - '\windows\syswow64\'
  - '\windows\microsoft.net\'
  - '\windows\winsxs\'
  - '\program files\powershell\'
  - '\program files\windowsapps\'

cmdline_patterns:
  - name: powershell-encoded-command
    regex: '(?i)\s-(e|ec|enc|encodedcommand)\s+[A-Za-z0-9+/=]{16,}'
  - name: powershell-download-cradle
    regex: '(?i)(downloadstring|downloadfile|invoke-webrequest|invoke-expression|\biex\b)'
  - name: powershell-tcpclient
    regex: '(?i)system\.net\.sockets\.tcpclient'
  - name: hidden-window
    regex: '(?i)\s-w(indowstyle)?\s+hidden'
  - name: bash-dev-tcp
    regex: '/dev/(tcp|udp)/'
  - name: fifo-with-netcat
    regex: '(?i)\bmkfifo\b.*\b(nc|ncat|netcat)\b'
  - name: netcat-exec
    regex: '(?i)\b(nc|ncat|netcat)(\.exe)?\s.*\s-(e|c)\s'
  - name: socat-exec
    regex: '(?i)\bsocat\b.*\bexec:'
  - name: python-socket-oneliner
    regex: '(?i)\bpython[0-9.]*(\.exe)?\s+-c\s.*\bsocket\b'

weights:
  RSH-001: 4
  RSH-002: 4
  RSH-003: 2
  RSH-004: 3
  RSH-005: 1
  RSH-006: 2
  RSH-007: 4
  RSH-008: 3
  RSH-009: 3
  RSH-010: 3
  RSH-011: 5
  PCAP-001: 3
  PCAP-002: 1
  PCAP-003: 2
  PCAP-004: 3
  PCAP-005: 5

# Severidade = maior limiar atingido pelo score.
severity:
  high: 7
  medium: 4
  low: 1

# Só achados com score >= min_score são reportados.
min_score: 3

beacon:
  min_events: 6
  max_cv: 0.25              # coeficiente de variação máximo dos intervalos (desvio/média)
  min_interval_seconds: 5   # ignora rajadas mais rápidas que isso
  history_seconds: 3600

# Cada item suprime achados quando TODOS os campos informados casam.
# Exemplo:
#   - { process: plink.exe, remote_cidr: 203.0.113.0/24 }
#   - { process: backup-agent.exe, remote_port: 9001 }
allowlist: []

blocklist_ips: []      # IPs/CIDRs inline
blocklist_file: null   # arquivo texto, um IP/CIDR por linha (# comentários)
